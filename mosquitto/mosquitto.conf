# ───────────────────────────────────────────────────────
# Eclipse Mosquitto — Production Configuration
#
# Listeners:
#   - Port 1883: Standard MQTT TCP (backend + IoT devices)
#   - Port 9001: MQTT over WebSockets (browser frontend)
#
# Security: Anonymous access enabled for internal Docker network.
#           In a public-facing deployment, add authentication.
# ───────────────────────────────────────────────────────

# ─── Persistence ──────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─── Logging ──────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type all

# ─── Listener 1: Standard MQTT TCP (port 1883) ───────
listener 1883
protocol mqtt
allow_anonymous true

# ─── Listener 2: MQTT over WebSocket (port 9001) ─────
# Required for the browser-based frontend MQTT client
listener 9001
protocol websockets
allow_anonymous true
