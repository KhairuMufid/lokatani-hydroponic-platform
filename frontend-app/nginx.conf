# ───────────────────────────────────────────────────────
# Lokatani Frontend — Nginx Configuration
#
# Handles:
#   1. SPA Routing: All non-file requests → index.html (React Router)
#   2. API Reverse Proxy: /api/* → backend:3000
#   3. WebSocket Upgrade: /ws → backend:8080
#   4. Static Asset Serving: /uploads/* → backend:3000
#   5. Gzip Compression for performance
# ───────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ─────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── API Reverse Proxy → Backend HTTP ─────────────
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── WebSocket Proxy dengan HTTP Upgrade [PERBAIKAN] ───
    location /ws {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        
        # Header wajib untuk mempertahankan koneksi WebSocket
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Batas waktu diperpanjang menjadi 24 jam agar koneksi streaming tidak terputus otomatis
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Uploaded Images → Backend Static ─────────────
    location /uploads/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ─── Static Assets (JS, CSS, images) ──────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── SPA Fallback (React Router) ──────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
